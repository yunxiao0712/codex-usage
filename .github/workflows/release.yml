name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag and secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$app_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $app_version" >&2
            exit 1
          fi
          for secret_name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required secret: $secret_name" >&2
              exit 1
            fi
          done
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_owner="$(echo "$repository_owner" | tr '[:upper:]' '[:lower:]')"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
          echo "QUOTAGLOW_UPDATE_FEED_URL=https://${repository_owner}.github.io/${repository_name}/appcast.xml" >> "$GITHUB_ENV"
          echo "SPARKLE_DOWNLOAD_URL_PREFIX=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" >> "$GITHUB_ENV"

      - name: Import Developer ID and configure notarization
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/quotaglow-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printenv DEVELOPER_ID_P12_BASE64 | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$signing_identity" ]]; then
            echo "Developer ID Application identity not found" >&2
            exit 1
          fi
          xcrun notarytool store-credentials quotaglow-ci \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path"
          echo "CODESIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=quotaglow-ci" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          QUOTAGLOW_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          ./scripts/package_release.sh
          ./scripts/notarize_release.sh
          ./.release/app/QuotaGlow.app/Contents/MacOS/QuotaGlow --self-test
          codesign --verify --deep --strict --verbose=2 ./.release/app/QuotaGlow.app
          spctl --assess --type execute --verbose=2 ./.release/app/QuotaGlow.app

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make_appcast.sh

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".release/QuotaGlow-${APP_VERSION}-stable.dmg" \
            ".release/updates/QuotaGlow-${APP_VERSION}-stable.zip" \
            ".release/SHA256SUMS" \
            --verify-tag \
            --title "QuotaGlow ${APP_VERSION}" \
            --draft \
            --generate-notes

      - name: Prepare update feed
        run: |
          mkdir -p .release/pages
          cp .release/appcast.xml .release/pages/appcast.xml

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .release/pages

  deploy-feed:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Sparkle feed
        id: deployment
        uses: actions/deploy-pages@v5

  publish-release:
    needs: deploy-feed
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
