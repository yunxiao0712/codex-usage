name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./build.sh
      - name: Run self-tests
        run: ./.artifacts/QuotaGlow.app/Contents/MacOS/QuotaGlow --self-test
      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 ./.artifacts/QuotaGlow.app
